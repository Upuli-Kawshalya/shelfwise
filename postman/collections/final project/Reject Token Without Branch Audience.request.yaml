  - type: afterResponse
    code: "\r

      const token = pm.request.auth.bearer.find(\r

      \    item => item.key === \"token\"\r

      )?.value;\r

      \r

      if (token && token.split(\".\").length === 3) {\r

      \    const base64 = token.split(\".\")[1]\r

      \        .replace(/-/g, \"+\")\r

      \        .replace(/_/g, \"/\");\r

      \r

      \    const payload = JSON.parse(\r

      \        Buffer.from(base64, \"base64\").toString(\"utf8\")\r

      \    );\r

      \r

      \    console.log(\"Current token audience:\", payload.aud);\r

      } else {\r

      \    console.log(\"No valid JWT found in request authorization.\");\r

