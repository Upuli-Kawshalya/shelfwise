scripts:
  - type: afterResponse
    code: "const token = pm.response.json().access_token;\r

      \r

      const payload = token.split('.')[1];\r

      \r

      const base64 = payload\r

      \    .replace(/-/g, '+')\r

      \    .replace(/_/g, '/');\r

      \r

      const decoded = JSON.parse(\r

      \    atob(base64)\r

      );\r

      \r

      console.log(\"Realm roles:\", decoded.realm_access?.roles);\r

      \r

      console.log(\r

      \    \"INTERNAL_SERVICE role found:\",\r

      \    decoded.realm_access?.roles?.includes(\"INTERNAL_SERVICE\")\r

      );"
